<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D14"/>
      <stop offset="1" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="glow" x1="250" y1="50" x2="950" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2EE6A6" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#98FF98" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2EE6A6" stop-opacity="0.15"/>
      <animate attributeName="x1" values="200;260;200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="900;980;900" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2EE6A6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2EE6A6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2EE6A6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <g opacity="0.2">
    <path d="M0 88C164 120 282 128 442 118C621 106 788 74 1200 98V0H0V88Z" fill="#0E1A14"/>
    <path d="M0 108C186 78 380 154 564 128C778 98 918 82 1200 112V0H0V108Z" fill="#163123"/>
    <path d="M0 124C198 114 460 110 622 114C804 118 1004 148 1200 156V0H0V124Z" fill="url(#glow)"/>
  </g>

  <g opacity="0.12">
    <path d="M72 62H1128" stroke="#89FFBD"/>
    <path d="M72 96H1128" stroke="#89FFBD"/>
    <path d="M72 130H1128" stroke="#89FFBD"/>
    <path d="M72 164H1128" stroke="#89FFBD"/>
    <path d="M72 198H1128" stroke="#89FFBD"/>
    <path d="M72 232H1128" stroke="#89FFBD"/>
    <path d="M72 266H1128" stroke="#89FFBD"/>
    <path d="M72 300H1128" stroke="#89FFBD"/>
  </g>

  <rect x="70" y="48" width="1060" height="264" rx="18" fill="#0B111B" stroke="#172231"/>
  <rect x="70" y="48" width="1060" height="38" rx="18" fill="#0E1622"/>
  <circle cx="102" cy="67" r="6" fill="#FF6B6B"/>
  <circle cx="124" cy="67" r="6" fill="#FFD166"/>
  <circle cx="146" cy="67" r="6" fill="#2EE6A6"/>
  <text x="174" y="72" fill="#7B93A9" font-family="'JetBrains Mono', monospace" font-size="15">ali@github: ~/profile/readme</text>

  <g filter="url(#softGlow)">
    <text x="600" y="178" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">ALI HUSSEINI</text>
  </g>

  <text x="600" y="232" text-anchor="middle" fill="#7CFFAD" font-family="'JetBrains Mono', monospace" font-size="25" font-weight="700">mechatronics @ waterloo  |  software x ai x hardware</text>
  <text x="600" y="272" text-anchor="middle" fill="#7CFFAD" font-family="'JetBrains Mono', monospace" font-size="21">building useful systems, not just demos</text>

  <rect x="132" y="282" width="936" height="2" fill="url(#line)">
    <animate attributeName="x" values="132;160;132" dur="4s" repeatCount="indefinite"/>
  </rect>

  <rect x="948" y="254" width="12" height="24" fill="#7CFFAD">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.7">
    <circle cx="1034" cy="124" r="3" fill="#2EE6A6">
      <animate attributeName="cy" values="124;118;124" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1058" cy="146" r="2.5" fill="#7CFFAD">
      <animate attributeName="cy" values="146;140;146" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1084" cy="132" r="2" fill="#B4FFD0">
      <animate attributeName="cy" values="132;126;132" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
