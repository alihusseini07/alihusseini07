<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ali Husseini — terminal hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06080C"/>
      <stop offset="1" stop-color="#0A1118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F1FB"/>
      <stop offset="1" stop-color="#9AB1C5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#11202C" stroke-width="1"/>
    </pattern>
    <radialGradient id="spotA" cx="0.18" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotB" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)" opacity="0.55"/>

  <!-- terminal window -->
  <rect x="36" y="28" width="1208" height="364" rx="14" fill="#05080C" stroke="#1B2733" stroke-width="1.5"/>
  <rect x="36" y="28" width="1208" height="364" rx="14" fill="url(#spotA)"/>
  <rect x="36" y="28" width="1208" height="364" rx="14" fill="url(#spotB)"/>

  <!-- title bar -->
  <path d="M36 42 a14 14 0 0 1 14 -14 h1180 a14 14 0 0 1 14 14 v30 h-1208 z" fill="#0E151D"/>
  <line x1="36" y1="72" x2="1244" y2="72" stroke="#1B2733" stroke-width="1"/>
  <circle cx="60" cy="50" r="6" fill="#FF5F57"/>
  <circle cx="80" cy="50" r="6" fill="#FEBC2E"/>
  <circle cx="100" cy="50" r="6" fill="#28C840"/>
  <text x="640" y="55" text-anchor="middle" fill="#7E94A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="13">— zsh — alihusseini07: ~/profile —</text>
  <circle cx="1182" cy="50" r="4" fill="#4ADE80"/>
  <text x="1194" y="54" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="12">online</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace">

    <!-- LEFT: wordmark -->
    <g transform="translate(80, 130)">
      <text x="0" y="0" font-size="18" fill="#22D3EE" font-weight="700">~/</text>
      <text x="32" y="0" font-size="18" fill="#7E94A8">whoami</text>
      <text x="0" y="118" font-size="148" font-weight="800" fill="url(#wordmark)" letter-spacing="-6">ali</text>
      <rect x="220" y="40" width="22" height="80" fill="#4ADE80">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="160" font-size="14" fill="#5C7388">Mechatronics Eng · 1B · uWaterloo</text>

      <!-- typewriter focus animation -->
      <g transform="translate(0, 210)">
        <text x="0" y="0" font-size="13" fill="#7E94A8">~/focus</text>
        <text x="58" y="0" font-size="13" fill="#7E94A8">→</text>

        <defs>
          <clipPath id="tw1" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width="0" height="1"><animate attributeName="width" begin="0s" dur="16s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.0625;0.125;0.1875;1"/></rect></clipPath>
          <clipPath id="tw2" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width="0" height="1"><animate attributeName="width" begin="0s" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3125;0.375;0.4375;1"/></rect></clipPath>
          <clipPath id="tw3" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width="0" height="1"><animate attributeName="width" begin="0s" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5625;0.625;0.6875;1"/></rect></clipPath>
          <clipPath id="tw4" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width="0" height="1"><animate attributeName="width" begin="0s" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.75;0.8125;0.875;0.9375;1"/></rect></clipPath>
        </defs>

        <g transform="translate(80, 0)" font-size="14" font-weight="700">
          <text clip-path="url(#tw1)" fill="#FDE68A">user-first</text>
          <text clip-path="url(#tw2)" fill="#67E8F9">applied AI</text>
          <text clip-path="url(#tw3)" fill="#9AB1C5">full-stack</text>
          <text clip-path="url(#tw4)" fill="#86EFAC">embedded</text>

          <!-- moving caret -->
          <rect x="0" y="-12" width="8" height="15" fill="#4ADE80" opacity="0.9">
            <animate attributeName="x" dur="16s" repeatCount="indefinite"
              values="0;100;100;0;0;100;100;0;0;100;100;0;0;82;82;0;0"
              keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"/>
            <animate attributeName="opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.45;0.5;0.95;1" dur="0.9s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- vertical divider -->
    <line x1="500" y1="100" x2="500" y2="360" stroke="#15212C" stroke-width="1" stroke-dasharray="2 5"/>

    <!-- RIGHT: terminal session -->
    <g transform="translate(540, 116)" font-size="15">
      <!-- prompt 1 -->
      <text fill="#4ADE80">alihusseini07</text>
      <text x="109" fill="#7E94A8">:</text>
      <text x="117" fill="#22D3EE">~/profile</text>
      <text x="197" fill="#7E94A8">$</text>
      <text x="215" fill="#E6F1FB">cat headline.txt</text>
      <text y="28" fill="#F7FAFC" font-size="22" font-weight="700">building things that actually work.</text>
      <text y="54" fill="#7E94A8" font-size="13">// practical systems · shipped with intent</text>

      <!-- prompt 2 -->
      <text y="98" fill="#4ADE80">alihusseini07</text>
      <text y="98" x="109" fill="#7E94A8">:</text>
      <text y="98" x="117" fill="#22D3EE">~/profile</text>
      <text y="98" x="197" fill="#7E94A8">$</text>
      <text y="98" x="215" fill="#E6F1FB">echo $STATUS</text>

      <text y="126" fill="#FACC15">[OPEN]</text>
      <text y="126" x="64" fill="#E6F1FB">Fall 2026 SWE internships</text>

      <text y="150" fill="#A78BFA">[PREV]</text>
      <text y="150" x="64" fill="#9AB1C5">SWE Co-op · ATS360 / Netdynamic</text>

      <text y="174" fill="#22D3EE">[FOCUS]</text>
      <text y="174" x="64" fill="#9AB1C5">user-first products · fast, useful, well-structured</text>

    </g>
  </g>

  <!-- accent underline -->
  <rect x="36" y="390" width="1208" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>
</svg>
